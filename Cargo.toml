[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
nm-core = { path = "crates/nm-core" }
nm-store = { path = "crates/nm-store" }
nm-api = { path = "crates/nm-api" }
nm-proto = { path = "crates/nm-proto" }
nm-engine = { path = "crates/nm-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "trace"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
rand = "0.9"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
mail-parser = "1"
ammonia = "4"
# HTML5 named entities (already built for ammonia, through html5ever).
markup5ever = "0.40"
# HTML5 tokenizer, the one ammonia parses with (`remote_images.rs`).
html5ever = "0.40"
# CSS tokenizer (Servo's), already built for ammonia: the sanitizer of the
# sender's CSS reads with it (`css.rs`).
cssparser = { version = "0.38", default-features = false }
sha2 = "0.11"
# The text of the attachments the AI summarizes (`nm-store`,
# `attachment_text.rs`): PDF, and DOCX (a zip of XML files), read only,
# deflate only (the one compression Word uses), no encryption, no writing.
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Text attachments in a legacy charset (Windows-1252), UTF-16 with a BOM.
encoding_rs = "0.8"
zstd = "0.14"
tempfile = "3"
libc = "0.2"
# HTTP client of nm-proto: small, blocking (called off the async runtime),
# TLS by rustls.
ureq = "3"
# config.toml: parsed with the position of every key, for errors with a
# line number; later edited in place, keeping comments (`configuration.md`).
toml_edit = "0.25"
# Watches config.toml (FSEvents on macOS) to apply it without a restart.
notify = "8"
# The macOS Keychain, where the core keeps the passwords of the accounts
# (`nm-engine`, `keychain.rs`), and the Core Foundation types it takes.
security-framework = "3"
core-foundation = "0.10"
# IMAP client of nm-proto (`nm-proto/src/imap/`). imap-codec parses the
# server's responses; it is an alpha, pinned to the exact version tried in
# phase 0 (`plan-imap.md`, section 2), and only `nm-proto::imap` sees its types.
imap-codec = { version = "=2.0.0-alpha.10", features = ["ext_condstore_qresync", "ext_id", "ext_namespace", "starttls"] }
# TLS of the IMAP connections: rustls on tokio, with the ring provider
# already built for ureq, and certificates checked by macOS's own trust
# settings (rustls-platform-verifier), plus an optional authority per account.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.6"
rustls-pki-types = { version = "1", features = ["std"] }
# DNS of nm-proto (`dns.rs`): the MX of an address's domain, to recognize
# the provider hosting it when an account is added (`docs/accounts.md`).
# Only what reading the system's resolvers takes: no DNS over TLS/HTTPS,
# no DNSSEC.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }

# The tests build in debug mode, where hashing and MIME parsing are 10 to
# 50 times slower than in release: the test of a 150 MB message
# (nm-store/tests/big_message.rs) took 24 s. These crates are compiled
# optimized even in debug builds; the code of NiceMailer itself stays
# unoptimized, so it still compiles fast and debugs well.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.mail-parser]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
