[package]
name = "nm-daemon"
description = "Core process: JSON-RPC server over a Unix socket"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nicemailer-core"
path = "src/main.rs"

[dependencies]
nm-core.workspace = true
nm-api.workspace = true
nm-store.workspace = true
nm-proto.workspace = true
nm-engine.workspace = true
nm-ai = { path = "../nm-ai" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
rand.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The MCP server, run in the tests against this core (`tests/mcp_proxy.rs`).
nm-mcp = { path = "../nm-mcp" }
# Builds the DOCX attached to the mails of the MCP tests.
zip.workspace = true
# Reads what the test SMTP server (Mailpit) received (`tests/send_rpc.rs`).
ureq = { workspace = true, features = ["json"] }
# The proxy of `tests/pace_rpc.rs` that answers logins: TLS towards the test
# Dovecot, clear text towards the core.
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
