[package]
name = "nm-daemon"
description = "Core process: JSON-RPC server over a Unix socket"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "nicemailer-core"
path = "src/main.rs"

[features]
# Reads the `password` key of config.toml, for development only
# (`plan-imap.md`, section 2): the shipped core never reads a password from
# a file that the specification invites to keep in Git. `make core` enables
# it; a plain `cargo build` does not.
dev-passwords = []

[dependencies]
nm-core.workspace = true
nm-api.workspace = true
nm-store.workspace = true
nm-proto.workspace = true
nm-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
rand.workspace = true

[dev-dependencies]
tempfile.workspace = true
