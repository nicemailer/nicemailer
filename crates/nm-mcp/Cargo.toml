[package]
name = "nm-mcp"
description = "MCP server for AI agents: nicemailer-mcp, a thin adapter between MCP and the core's contract"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nicemailer-mcp"
path = "src/main.rs"

[dependencies]
nm-api.workspace = true
nm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-std", "fs"] }
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
rand.workspace = true

[dev-dependencies]
tempfile.workspace = true
