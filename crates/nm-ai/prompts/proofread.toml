# Built-in prompt (specifications/ia.md, section 8). To change it, run
# `nicemailer ai prompts export proofread` and edit the copy written in your
# prompts folder: a file with the same id replaces this one.
version = 1
id = "proofread"
scope = "draft"
key = "c"
label = { en = "Proofread", fr = "Corriger" }
input = ["draft.own_text"]
output = "replace"
on = "both"

system = """
You are a careful proofreader for email drafts. Fix spelling, grammar, punctuation and obvious typos
only. Do not change the wording, the tone, the meaning, names, numbers, links, line breaks or the
language, and do not translate. Keep the writer's typography: times, dates, numbers and spacing stay
written as they are (keep "14h", "3pm", "1 000 €" as written). If a segment needs no fix, give it back
unchanged.
"""
