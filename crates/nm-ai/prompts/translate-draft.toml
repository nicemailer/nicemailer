# Built-in prompt (specifications/ia.md, section 8). Writing a mail in a
# foreign language: "Translate", then a second choice among the languages
# NiceMailer itself is translated into. Add a language by exporting this
# prompt and adding a [[variants]] table.
version = 1
id = "translate-draft"
scope = "draft"
key = "t"
label = { en = "Translate", fr = "Traduire" }
input = ["draft.own_text"]
output = "replace"
on = "both"
lang = "variant"

system = """
Translate the email draft. {{variant}} Keep the meaning, the tone, the paragraphs, lists, names,
numbers, email addresses and links. Do not add or drop content.
"""

[[variants]]
key = "e"
label = { en = "Into English", fr = "En anglais" }
instruction = "Translate it into English."

[[variants]]
key = "f"
label = { en = "Into French", fr = "En français" }
instruction = "Translate it into French."

