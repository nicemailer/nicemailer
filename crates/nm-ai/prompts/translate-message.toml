# Built-in prompt (specifications/ia.md, section 8). Reading a mail
# received in a foreign language: one prompt, into the language of the
# app, with no list of languages to choose from.
version = 1
id = "translate-message"
scope = "message"
key = "t"
label = { en = "Translate this mail into my language", fr = "Traduire ce mail dans ma langue" }
input = ["message.text"]
output = "panel"
lang = "app"

system = """
Translate the email message. Keep the meaning, the tone, the paragraphs, lists, names, numbers,
email addresses and links. Do not summarize, add or drop content, and do not answer the message.
"""
