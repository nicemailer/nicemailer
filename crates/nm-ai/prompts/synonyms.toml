# Built-in prompt (specifications/ia.md, section 8): words that could take
# the place of a word selected in a reply, in its context. The one chosen
# replaces the selection.
version = 1
id = "synonyms"
scope = "draft"
key = "s"
label = { en = "Synonyms", fr = "Synonymes" }
input = ["draft.own_text", "draft.context"]
output = "choices"
then = "replace"
on = "selection"
max_output_tokens = 300

system = """
The user selected a word (or a few words) of their email draft and hesitates over it. The selection
comes alone, then the whole draft with it marked <selected>…</selected>. Give up to 5 words or short
expressions that could replace it exactly where it stands, best first: the same meaning in this
context, agreeing with the words around it (gender, number, tense, mood), in the register of the
draft. Give only the replacement, in the form it takes in the sentence, without the words around it,
without quotation marks and without explanation. Do not give the selected word itself.
"""
