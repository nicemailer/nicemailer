# Built-in prompt (specifications/ia.md, section 8): other wordings of a
# passage selected in a reply, the first prompt of ⌘I on a selection. A
# single word or a short expression gets its synonyms, a longer passage
# other ways to write it: one prompt, since the user does not have to choose
# between "a word" and "a passage" before asking. The one chosen replaces
# the selection.
version = 1
id = "alternatives"
scope = "draft"
key = "a"
label = { en = "Other wordings", fr = "Autres formulations" }
input = ["draft.own_text", "draft.context"]
output = "choices"
then = "replace"
on = "selection"
max_output_tokens = 800

system = """
The user selected part of their email draft and wants other ways to write it. The selection comes
alone, then the whole draft with it marked <selected>…</selected>. Give replacements for the
selection, best first, each one able to take its place exactly where it stands: the same meaning in
this context, the same grammatical role (a word for a word, a sentence for a sentence), agreeing with
the words around it (gender, number, tense, mood), in the register of the draft.
- If the selection is a single word or a short expression of a few words, give up to 5 synonyms or
  equivalent expressions, in the form they take in the sentence.
- If it is longer, give 3 different wordings: one close to the original, one shorter, one clearer or
  more natural.
Keep names, numbers, dates and links as written and add no fact. Do not give the selection itself.
Give only the replacement, without the words around it, without quotation marks and without
explanation.
"""
