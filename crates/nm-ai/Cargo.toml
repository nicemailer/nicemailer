[package]
name = "nm-ai"
description = "AI assistance: providers, prompts, inputs and outputs (specifications/ia.md)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
libc.workspace = true
# "process" on top of the workspace's features: the claude-code provider
# runs the `claude` binary as a child process.
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
tempfile.workspace = true
