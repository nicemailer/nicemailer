# The clean theme: closer to a web site, sober and easy to read
# (specifications/ui.md, "Un thème est une présentation").
version = 1

[window]
chrome = "status_bar"
status_bar_position = "top"
title_bar = "merged"
block_labels = true
status_bar_height = 40
block_style = "pill"
bar_line = true
key_hints = false
blocks = ["account", "folder", "attributes", "|", "view", "|", "move", "save", "ai", "->", "help"]
default_columns = 2

[fonts]
interface = "system"
reading = "system"
reading_scale = 1.15
reading_line_spacing = 6
title_scale = 1.7

[layout]
row_height = 30
row_radius = 8
row_inset = 8
zebra = false
menu_row_height = 26
popup_radius = 14
popup_shadow = true
popup_padding = 18
menu_keys = "right"
message_cards = false
avatars = false
reader_max_width = 560
reader_title_padding = 12
scrollers = "thin"
separators = "space"

[motion]
sidebar_ms = 120
popup_ms = 80

[colors]
background = { light = "#FFFFFF", dark = "#1B1D1F" }
sidebar = { light = "#F6F6F3", dark = "#1E2022" }
list = { light = "#FFFFFF", dark = "#18191B" }
bar = { light = "#FFFFFF", dark = "#18191B" }
text = { light = "#1C1E1B", dark = "#E6E7E3" }
muted = { light = "#676C65", dark = "#92978F" }
accent = "#8AA581"
accent_text = { light = "#4E6A46", dark = "#9DBB93" }
selection = { light = "#EEF2EC", dark = "#272D26" }
selection_text = { light = "#1C1E1B", dark = "#E6E7E3" }
marked = { light = "#F3E3EE", dark = "#3A2E45" }
marked_bar = { light = "#C2408F", dark = "#E08AC0" }
separator = { light = "#ECECE8", dark = "#2A2C2F" }
popup = { light = "#FFFFFF", dark = "#222427" }
unread = { light = "#B07D16", dark = "#E6C07B" }
flag = { light = "#D9661C", dark = "#F0883E" }
error = { light = "#C0392B", dark = "#E06C75" }
virtual_folder = { light = "#4E6A46", dark = "#9DBB93" }
