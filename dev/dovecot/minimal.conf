# Loaded by the "minimal" test server only (compose.yaml): announce the
# capabilities of a plain IMAP4rev1 server, like the one Infomaniak shows,
# so the tests exercise the fallbacks (no CONDSTORE, QRESYNC, MOVE, ESEARCH,
# SPECIAL-USE). Dovecot still implements them; announcing them is what
# clients rely on, and NiceMailer only uses what is announced.
imap4rev2_enable = no
imap_capability = IMAP4rev1 UIDPLUS IDLE LITERAL+ AUTH=PLAIN
